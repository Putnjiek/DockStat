<div class="container">
    <div class="navbar">
        <div class="logo-title">
            <img class="logo" src="../assets/pictures/logo.png" alt="dockstat logo" />
            <h1 class="title">{{title}}</h1>
        </div>
        <div class="buttons">
            <button class="button" (click)="settingDialogState().open = true">
                <i class="fa-solid fa-gear fa-xs"></i>
            </button>
            <button class="button" (click)="codeDialogState().open = true">
                <i class="fa-solid fa-code fa-xs"></i>
            </button>
            <a class="git-logo" href="https://github.com/its4nik/dockstat" target="_blank">
                <i class="fa-brands fa-github github-logo"></i>
            </a>
        </div>
    </div>
    <app-status-card />
</div>

<app-dialog [state]="codeDialogState()">
    <pre class="code">
        <code>
            {{code}}
        </code>
    </pre>
</app-dialog>

<app-dialog [state]="settingDialogState()" title="Settings">
    <div class="container">
        <div class="settings">
            <div class="label">
                Select Theme
            </div>
            <app-dropdown [items]="themes" [(selectedItem)]="theme" (selectedItemChange)="onThemeSelection()" />
        </div>
    </div>
</app-dialog>
